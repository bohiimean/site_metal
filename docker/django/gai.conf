# Порядок выбора адреса (glibc, RFC 6724) для контейнера web.
#
# С хостинга Telegram доступен только по IPv6 — по IPv4 соединение висит
# до таймаута. IPv6 у web есть через сеть egress6 (docker-compose.prod.yml),
# но её адрес — локальный ULA (fc00::/7), и по умолчанию glibc ставит IPv4
# выше: каждое уведомление ждало бы таймаут IPv4. Метка ULA = метке ::/0
# уравнивает их, и IPv6 выигрывает по приоритету. Остальные строки —
# стандартная таблица glibc (если задана хоть одна label, она заменяет
# всю таблицу).
label ::1/128       0
label ::/0          1
label 2002::/16     2
label ::/96         3
label ::ffff:0:0/96 4
label fec0::/10     5
label fc00::/7      1
label 2001:0::/32   7
