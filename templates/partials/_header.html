<header class="bg-surface border-b border-border shrink-0" style="height:68px"
        x-data="{ menuOpen: false }"
        x-init="$watch('menuOpen', function (v) { document.body.style.overflow = v ? 'hidden' : ''; })"
        @keydown.escape.window="menuOpen = false">
  <div class="max-w-7xl mx-auto px-6 lg:px-12 h-full flex items-center justify-between gap-6">

    <!-- Логотип -->
    <a href="/" class="text-[17px] font-bold tracking-tight shrink-0">
      Арве<span class="text-accent">нокс</span>
    </a>

    <!-- Навигация -->
    <nav class="hidden md:flex items-center gap-7 text-[13px] font-medium text-muted">
      <a href="/produkciya/" class="hover:text-primary transition-colors">Каталог</a>
      <a href="/catalog/" class="hover:text-primary transition-colors">Все товары</a>
      <a href="/o-kompanii/" class="hover:text-primary transition-colors">О компании</a>
      <a href="/kontakty/" class="hover:text-primary transition-colors">Контакты</a>
    </nav>

    <div class="flex items-center gap-4 ml-auto">
      <!-- Поиск -->
      <form action="/search/" method="get"
            x-data="{ q: '{{ request.GET.q|default:''|escapejs }}' }"
            class="hidden lg:flex items-center gap-2 border border-border rounded-full px-3 py-1.5 w-44 focus-within:w-56 focus-within:border-accent transition-all duration-200">
        <button type="submit" class="shrink-0 text-muted hover:text-primary transition-colors">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
          </svg>
        </button>
        <input type="text" name="q" x-model="q" placeholder="Поиск по каталогу…"
               class="flex-1 min-w-0 bg-transparent outline-none text-[12px] text-primary placeholder:text-muted">
        <button x-show="q" x-cloak type="button"
                @click="q = ''; $nextTick(() => $el.closest('form').submit())"
                class="shrink-0 text-muted hover:text-primary transition-colors leading-none">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none">
            <path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </button>
      </form>

      <!-- Переключатель темы -->
      <div x-data="themeToggle">
        <button @click="toggle"
                class="w-8 h-8 flex items-center justify-center rounded text-muted hover:text-primary transition-colors"
                :aria-label="dark ? 'Светлая тема' : 'Тёмная тема'">
          <!-- Иконка солнца (светлая тема активна) -->
          <svg x-show="dark" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/>
          </svg>
          <!-- Иконка луны (тёмная тема активна) -->
          <svg x-show="!dark" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>

      <!-- Телефон -->
      <a href="tel:+79777455455" class="hidden xl:block text-[13px] font-semibold text-primary whitespace-nowrap">
        +7 (977) 745-54-55
      </a>

      <!-- Корзина -->
      <button @click="$store.cartUI.openCart()"
              class="relative w-8 h-8 flex items-center justify-center text-muted hover:text-primary transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 3h2l.4 2M7 13h10l4-9H5.4M7 13L5.4 5M7 13l-1.5 6M17 13l1.5 6M9 19a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm8 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/>
        </svg>
        <span x-show="$store.cart.count > 0"
              x-text="$store.cart.count"
              class="absolute -top-1 -right-1 w-4 h-4 bg-accent text-accent-fg text-[9px] font-bold rounded-full flex items-center justify-center">
        </span>
      </button>

      <!-- Меню (до lg: на телефоне скрыты навигация и поиск, на планшете — поиск) -->
      <button type="button" @click="menuOpen = true"
              class="lg:hidden w-8 h-8 -mr-1 flex items-center justify-center text-muted hover:text-primary transition-colors"
              aria-label="Меню" :aria-expanded="menuOpen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

  </div>

  <!-- ─── Мобильное меню: выдвижная панель, как фильтры каталога.
       z-index как у панели фильтров: выше кнопки «наверх» (70) ─── -->
  <div x-show="menuOpen" x-cloak x-transition.opacity
       @click="menuOpen = false"
       class="fixed inset-0 bg-black/40 z-[85] lg:hidden"></div>

  <div x-show="menuOpen" x-cloak
       x-transition:enter="transition-transform duration-200 ease-out"
       x-transition:enter-start="-translate-x-full"
       x-transition:enter-end="translate-x-0"
       x-transition:leave="transition-transform duration-200 ease-in"
       x-transition:leave-start="translate-x-0"
       x-transition:leave-end="-translate-x-full"
       class="fixed inset-y-0 left-0 z-[90] w-80 max-w-[85vw] bg-surface flex flex-col overflow-y-auto lg:hidden"
       role="dialog" aria-label="Меню">

    <div class="flex items-center justify-between px-5 shrink-0 border-b border-border" style="height:68px">
      <a href="/" class="text-[17px] font-bold tracking-tight">
        Арве<span class="text-accent">нокс</span>
      </a>
      <button type="button" @click="menuOpen = false" title="Закрыть"
              class="w-8 h-8 -mr-1 flex items-center justify-center text-muted hover:text-accent">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="px-5 py-5">
      <form action="/search/" method="get"
            class="flex items-center gap-2 border border-border-strong rounded-full px-4 py-2.5 focus-within:border-accent transition-colors">
        <svg class="w-4 h-4 shrink-0 text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
        </svg>
        <!-- 16px: iOS зумит страницу при фокусе на поле с шрифтом мельче -->
        <input type="search" name="q" value="{{ request.GET.q|default:'' }}"
               placeholder="Поиск по каталогу…" enterkeyhint="search"
               class="flex-1 min-w-0 bg-transparent outline-none text-[16px] text-primary placeholder:text-muted">
      </form>

      <nav class="mt-5 flex flex-col text-[15px] font-medium text-primary">
        <a href="/produkciya/" class="py-3 border-b border-border hover:text-accent transition-colors">Каталог</a>
        <a href="/catalog/" class="py-3 border-b border-border hover:text-accent transition-colors">Все товары</a>
        <a href="/o-kompanii/" class="py-3 border-b border-border hover:text-accent transition-colors">О компании</a>
        <a href="/kontakty/" class="py-3 border-b border-border hover:text-accent transition-colors">Контакты</a>
      </nav>

      <a href="tel:+79777455455" class="block mt-6 text-[17px] font-semibold text-primary">
        +7 (977) 745-54-55
      </a>
      <button type="button" @click="menuOpen = false; $store.callbackUI.openModal()"
              class="btn-accent w-full mt-4">
        Заказать звонок
      </button>
    </div>
  </div>
</header>
